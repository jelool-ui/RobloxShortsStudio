          - "devoir-oublie"
          - "casier-fantome"
          - "concours-saut"
          - "rumeur-pizza"
          - "sac-magique"
          - "interro-surprise"
          - "hamster-evade"
          - "photo-de-classe"
          - "dictee-piege"
          - "plante-parlante"
          - "robot-science"
          - "volcan-experience"
          - "election-delegue"
          - "bibliotheque-silence"
          - "craie-disparue"
          - "cartable-lourd"
          - "lunettes-perdues"
          - "casquette-volee"
          - "poisson-avril"
          - "exercice-incendie"
          - "panne-courant"
          - "chorale-fausse-note"
          - "concours-dessin"
          - "mot-excuse"
          - "kermesse-gateau"
          - "casier-coince"
          - "lacet-defait"
