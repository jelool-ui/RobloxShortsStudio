          - "cle-perdue"
          - "bruit-de-pas"
          - "tableau-affichage"
          - "carte-anniversaire"
          - "moustache-dessin"
          - "rumeur-prof-robot"
          - "fontaine-a-eau"
          - "pas-de-sport"
