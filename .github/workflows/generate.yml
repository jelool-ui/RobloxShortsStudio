          - "record-glissade"
          - "ballon-arbre"
          - "cache-cache"
          - "chasse-tresor"
          - "marelle-championne"
          - "course-escargots"
          - "flocons-mai"
          - "nuages-formes"
          - "tournoi-billes"
          - "pigeon-gourmand"
          - "un-deux-trois-soleil"
          - "panier-impossible"
          - "gouter-echange"
          - "casquette-vent"
          - "avion-papier"
          - "club-secret"
          - "pluie-soudaine"
          - "corde-a-sauter"
          - "sieste-banc"
          - "fourmis-colonne"
          - "statue-humaine"
          - "sortie-zoo"
          - "spectacle-fin-annee"
          - "deguisement"
          - "anniversaire-surprise"
          - "journee-pyjama"
          - "classe-verte"
          - "journee-sport"
          - "echange-cadeaux"
          - "halloween-citrouille"
          - "premier-jour"
          - "dernier-jour"
          - "bulletin-notes"
          - "jour-de-neige"
          - "magicien"
          - "incroyable-talent"
          - "reunion-parents"
          - "loto-ecole"
          - "carnaval"
